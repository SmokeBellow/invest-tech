name: Run backtest

on:
  workflow_dispatch:  # вручную — прогон бэктеста по уже собранным данным

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy tabulate

      - name: Run backtest
        run: python scripts/backtest.py

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add results/
          git diff --staged --quiet || git commit -m "Update backtest report ($(date +%Y-%m-%d))"
          git push
