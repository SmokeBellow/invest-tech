name: Live paper-trading daily review

on:
  # schedule ОТКЛЮЧЁН 08.09.2026 по запросу пользователя ("останавливаем
  # проект и завершаем пересмотры") — live paper-trading счёт остановлен,
  # история в data/live/ и на GitHub Pages сохранена как есть, не удаляется.
  # workflow_dispatch оставлен для ручного запуска, если проект возобновят.
  # Была: cron "12 4 * * *" (04:12 UTC ≈ 09:12 Екатеринбург), см. историю
  # выбора времени в CLAUDE.md §1/§9.3/§13.
  workflow_dispatch: {}   # ручной запуск для отладки

permissions:
  contents: write   # коммит data/ обратно в ветку
  pages: write       # деплой графика на GitHub Pages
  id-token: write    # требуется actions/deploy-pages

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas numpy scipy tabulate

      - name: Fetch latest daily bars (incremental)
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: python scripts/live_fetch_incremental.py

      - name: Run mechanical live review (no LLM involved — pure rules)
        run: python scripts/live_review.py

      - name: Commit updated data and live state
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Live review: update data + paper portfolio state ($(date -u +%Y-%m-%d))"
          git pull --rebase
          git push

      - name: Render equity chart for GitHub Pages
        run: |
          mkdir -p site
          python scripts/render_live_chart.py --out site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
