name: Live paper-trading daily review

on:
  schedule:
    - cron: "0 4 * * *"  # 04:00 UTC = 09:00 Екатеринбург. Возвращено 24.08.2026 (было
                          # сдвинуто на 01:00 UTC/06:00 EKT 21.08.2026, но данные по
                          # акциям (SPY/TLT/SHY/GLD) у FMP/Tiingo регулярно ещё не были
                          # готовы через ~4-5ч после закрытия NYSE — наблюдали на практике
                          # 24.08.2026). 09:00 EKT (~7-8ч после закрытия) — исходное,
                          # эмпирически надёжное время, см. CLAUDE.md §1/§9.3
  workflow_dispatch: {}   # ручной запуск для отладки

permissions:
  contents: write   # коммит data/ обратно в ветку
  pages: write       # деплой графика на GitHub Pages
  id-token: write    # требуется actions/deploy-pages

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas numpy scipy tabulate

      - name: Fetch latest daily bars (incremental)
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: python scripts/live_fetch_incremental.py

      - name: Run mechanical live review (no LLM involved — pure rules)
        run: python scripts/live_review.py

      - name: Commit updated data and live state
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Live review: update data + paper portfolio state ($(date -u +%Y-%m-%d))"
          git pull --rebase
          git push

      - name: Render equity chart for GitHub Pages
        run: |
          mkdir -p site
          python scripts/render_live_chart.py --out site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
