name: Polymarket live scan

on:
  workflow_dispatch:
  schedule:
    # 05:20 UTC — независимо от cron A/B (04:12/15:12), минута смещена от
    # :00 по той же причине (см. CLAUDE.md, раздел 13 — GitHub задерживает
    # schedule-триггеры на круглом часе).
    - cron: "20 5 * * *"

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run Polymarket live scan
        run: python scripts/pm_live_scan.py

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/polymarket/
          git diff --staged --quiet || git commit -m "Polymarket live scan ($(date +%Y-%m-%d))"
          git pull --rebase origin ${{ github.ref_name }}
          git push
